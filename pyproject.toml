[build-system]
requires = ["flit_core >=3.8,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "idmap"
authors = [{ name = "Luiz Carvalho", email = "lucarval@redhat.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["identity", "correlation", "cli", "sqlite", "namespace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dynamic = ["version", "description"]

[project.urls]
Homepage = "https://github.com/lcarva/idmap"
Repository = "https://github.com/lcarva/idmap"
Issues = "https://github.com/lcarva/idmap/issues"

[project.scripts]
idmap = "idmap:main"

[tool.flit.module]
name = "idmap"
